name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release + debug APK
        run: gradle assembleRelease assembleDebug --no-daemon --stacktrace

      - name: Rename artifacts
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/DeepSeekPet-release-v1.0.0.apk
          cp app/build/outputs/apk/debug/app-debug.apk out/DeepSeekPet-debug-v1.0.0.apk
          ls -la out

      - name: Verify signature
        run: |
          BT=$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs \
            out/DeepSeekPet-release-v1.0.0.apk | head -20

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeekPet-apk
          path: out/*.apk
          retention-days: 30

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: DeepSeekPet build ${{ github.run_number }}
          body: |
            自动构建产物（固定签名）。
            - DeepSeekPet-release-v1.0.0.apk
            - DeepSeekPet-debug-v1.0.0.apk
          files: out/*.apk
          draft: false
          prerelease: false
