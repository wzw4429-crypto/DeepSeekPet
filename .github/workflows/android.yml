name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 注意：不用 android-actions/setup-android@v3。
      # 它默认会跑 `sdkmanager --install tools`，而 `tools` 包已从 SDK 源下架，
      # 导致该 action 直接 exit 1，构建在第一步就挂掉。
      # GitHub 的 ubuntu-latest 镜像本来就预装了 cmdline-tools，直接调用即可。
      - name: Prepare Android SDK
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK root = $SDK"
          SDKMGR=$(find "$SDK/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | sort | tail -1)
          echo "sdkmanager = $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null
          echo "sdk.dir=$SDK" > local.properties
          cat local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release + debug APK
        run: gradle assembleRelease assembleDebug --no-daemon --stacktrace

      - name: Rename artifacts
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/DeepSeekPet-release-v1.0.0.apk
          cp app/build/outputs/apk/debug/app-debug.apk out/DeepSeekPet-debug-v1.0.0.apk
          ls -la out

      # runner 上没装 ripgrep，这里只能用 grep
      - name: Verify fixed signature
        run: |
          set -e
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APKSIGNER="$SDK/build-tools/34.0.0/apksigner"
          echo "--- release 证书 ---"
          "$APKSIGNER" verify --print-certs out/DeepSeekPet-release-v1.0.0.apk | head -10
          REL=$("$APKSIGNER" verify --print-certs out/DeepSeekPet-release-v1.0.0.apk | grep 'SHA-256 digest' | head -1)
          DBG=$("$APKSIGNER" verify --print-certs out/DeepSeekPet-debug-v1.0.0.apk | grep 'SHA-256 digest' | head -1)
          echo "release: $REL"
          echo "debug  : $DBG"
          if [ "$REL" = "$DBG" ]; then
            echo "固定签名校验通过：debug 与 release 使用同一张证书"
          else
            echo "签名不一致，产物无法互相覆盖安装"; exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeekPet-apk
          path: out/*.apk
          retention-days: 30

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: DeepSeekPet build ${{ github.run_number }}
          body: |
            自动构建产物（固定签名，debug/release 同一证书，可互相覆盖安装）。
            - DeepSeekPet-release-v1.0.0.apk
            - DeepSeekPet-debug-v1.0.0.apk
          files: out/*.apk
          draft: false
          prerelease: false
